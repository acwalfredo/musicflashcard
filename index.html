<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="manifest" href="manifest.webmanifest">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼兒五線譜視譜記憶卡 App (G2 - G5)</title>
<style>
  :root { --primary: #4A90E2; --bg: #F4F7F6; }
  body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 10px 0; color: #333; font-size: 1.5rem; }
  .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
  select, button { padding: 8px 16px; font-size: 1rem; border-radius: 20px; border: 2px solid var(--primary); background: #fff; cursor: pointer; font-weight: bold; }
  .card-container { width: 300px; height: 430px; perspective: 1000px; margin: 10px 0; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; box-sizing: border-box; background: #fff; border: 3.5px solid #333; }
  .card-front { background: #ffffff; }
  .card-num { font-size: 0.9rem; color: #888; align-self: flex-start; }
  .staff-view { width: 100%; height: 220px; display: flex; justify-content: center; align-items: center; }
  .hint-text { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
  .card-back { transform: rotateY(180deg); }
  .answer-title { font-size: 1.8rem; font-weight: bold; }
  .icon-emoji { font-size: 3.5rem; margin: 2px 0; }
  .assoc-word { font-size: 1.1rem; font-weight: bold; color: #333; }
  .keyboard-view { width: 100%; height: 50px; margin: 5px 0; }
  .nav-btns { display: flex; gap: 20px; margin-top: 15px; }
  .nav-btn { padding: 10px 25px; font-size: 1.1rem; border-radius: 25px; border: none; background: #333; color: #fff; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<h1>🎵 幼兒五線譜視譜記憶卡</h1>

<div class="controls">
  <select id="category-select" onchange="filterCategory()">
    <option value="all">全部卡片 (32張)</option>
    <option value="treble">高音譜 (C4-G5)</option>
    <option value="bass">低音譜 (G2-D4)</option>
    <option value="symbol">音樂符號 (8張)</option>
  </select>
  <button id="btn-shuffle" onclick="shuffleCards()">🔀 隨機排序</button>
</div>

<div class="card-container" onclick="flipCard()">
  <div class="card" id="main-card">
    <div class="card-face card-front">
      <div class="card-num" id="card-num">No. 01</div>
      <div class="staff-view" id="staff-svg"></div>
      <div class="hint-text">💡 點擊卡片翻面看答案</div>
    </div>
    <div class="card-face card-back" id="card-back-face">
      <div class="card-num" id="card-num-back">No. 01 答案</div>
      <div class="answer-title" id="card-title">Do (C4)</div>
      <div class="icon-emoji" id="card-icon">🐱</div>
      <div class="assoc-word" id="card-eng">Cat</div>
      <div class="keyboard-view" id="keyboard-svg"></div>
      <div class="hint-text" id="card-desc">C4 - 中央 C</div>
    </div>
  </div>
</div>

<div class="nav-btns">
  <button class="nav-btn" onclick="prevCard(event)">⬅️ 上一張</button>
  <button class="nav-btn" onclick="nextCard(event)">下一張 ➡️</button>
</div>

<script>
const symbolSVGs = {
  whole: `<svg width="120" height="120" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="20" ry="14" fill="none" stroke="#111" stroke-width="5" transform="rotate(-20 50 50)"/><ellipse cx="50" cy="50" rx="8" ry="10" fill="#111" transform="rotate(30 50 50)"/></svg>`,
  half: `<svg width="120" height="120" viewBox="0 0 100 120"><ellipse cx="40" cy="80" rx="18" ry="12" fill="none" stroke="#111" stroke-width="4.5" transform="rotate(-20 40 80)"/><line x1="56" y1="76" x2="56" y2="20" stroke="#111" stroke-width="5"/></svg>`,
  quarter: `<svg width="120" height="120" viewBox="0 0 100 120"><ellipse cx="40" cy="80" rx="18" ry="12" fill="#111" transform="rotate(-20 40 80)"/><line x1="56" y1="76" x2="56" y2="20" stroke="#111" stroke-width="5"/></svg>`,
  eighth: `<svg width="120" height="120" viewBox="0 0 100 120"><ellipse cx="40" cy="80" rx="18" ry="12" fill="#111" transform="rotate(-20 40 80)"/><line x1="56" y1="76" x2="56" y2="20" stroke="#111" stroke-width="5"/><path d="M56 20 C68 30, 75 42, 78 55" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg>`,
  pairEighth: `<svg width="140" height="120" viewBox="0 0 120 120"><ellipse cx="30" cy="80" rx="15" ry="10" fill="#111" transform="rotate(-20 30 80)"/><line x1="43" y1="76" x2="43" y2="25" stroke="#111" stroke-width="4.5"/><ellipse cx="80" cy="80" rx="15" ry="10" fill="#111" transform="rotate(-20 80 80)"/><line x1="93" y1="76" x2="93" y2="25" stroke="#111" stroke-width="4.5"/><polygon points="41,25 95,25 95,35 41,35" fill="#111"/></svg>`,
  rest: `<svg width="100" height="120" viewBox="0 0 80 120"><path d="M35 20 L50 40 L30 65 L48 80 C35 95, 25 100, 30 105" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  trebleClef: `<svg width="100" height="140" viewBox="0 0 100 140"><text x="20" y="100" font-size="90px" fill="#111">𝄞</text></svg>`,
  bassClef: `<svg width="100" height="140" viewBox="0 0 100 140"><text x="20" y="90" font-size="80px" fill="#111">𝄢</text></svg>`
};

const cardsData = [
  // 高音譜 C4 ~ G5 (12張)
  {num:"01", clef:"treble", title:"Do (C4)", eng:"Cat", pos:"line_below", color:"#FF6B6B", desc:"C4 - 中央 C", bg:"#FFF0F0", key:0, icon:"🐱", freq:261.63},
  {num:"02", clef:"treble", title:"Re (D4)", eng:"Dog", pos:"space_below", color:"#FF922B", desc:"D4 - 下加一間", bg:"#FFF4E6", key:1, icon:"🐶", freq:293.66},
  {num:"03", clef:"treble", title:"Mi (E4)", eng:"Elephant", pos:"line_1", color:"#FCC419", desc:"E4 - 第一線", bg:"#FFF9DB", key:2, icon:"🐘", freq:329.63},
  {num:"04", clef:"treble", title:"Fa (F4)", eng:"Frog", pos:"space_1", color:"#51CF66", desc:"F4 - 第一間", bg:"#E6FCF5", key:3, icon:"🐸", freq:349.23},
  {num:"05", clef:"treble", title:"Sol (G4)", eng:"Giraffe", pos:"line_2", color:"#339AF0", desc:"G4 - 第二線", bg:"#E7F5FF", key:4, icon:"🦒", freq:392.00},
  {num:"06", clef:"treble", title:"La (A4)", eng:"Apple", pos:"space_2", color:"#845EF7", desc:"A4 - 第二間", bg:"#F3F0FF", key:5, icon:"🍎", freq:440.00},
  {num:"07", clef:"treble", title:"Ti (B4)", eng:"Bear", pos:"line_3", color:"#F06595", desc:"B4 - 第三線", bg:"#FFF0F6", key:6, icon:"🐻", freq:493.88},
  {num:"08", clef:"treble", title:"Do (C5)", eng:"Cat", pos:"space_3", color:"#FF6B6B", desc:"C5 - 第三間", bg:"#FFF0F0", key:0, icon:"🐱", freq:523.25},
  {num:"09", clef:"treble", title:"Re (D5)", eng:"Dog", pos:"line_4", color:"#FF922B", desc:"D5 - 第四線", bg:"#FFF4E6", key:1, icon:"🐶", freq:587.33},
  {num:"10", clef:"treble", title:"Mi (E5)", eng:"Elephant", pos:"space_4", color:"#FCC419", desc:"E5 - 第四間", bg:"#FFF9DB", key:2, icon:"🐘", freq:659.25},
  {num:"11", clef:"treble", title:"Fa (F5)", eng:"Frog", pos:"line_5", color:"#51CF66", desc:"F5 - 第五線", bg:"#E6FCF5", key:3, icon:"🐸", freq:698.46},
  {num:"12", clef:"treble", title:"Sol (G5)", eng:"Giraffe", pos:"space_above", color:"#339AF0", desc:"G5 - 上加一間", bg:"#E7F5FF", key:4, icon:"🦒", freq:783.99},

  // 低音譜 G2 ~ D4 (12張) - 已精確更正
  {num:"13", clef:"bass", title:"Sol (G2)", eng:"Girl", pos:"line_1", color:"#339AF0", desc:"G2 - 第一線", bg:"#E7F5FF", key:4, icon:"👧", freq:98.00},
  {num:"14", clef:"bass", title:"La (A2)", eng:"Ant", pos:"space_1", color:"#845EF7", desc:"A2 - 第一間", bg:"#F3F0FF", key:5, icon:"🐜", freq:110.00},
  {num:"15", clef:"bass", title:"Ti (B2)", eng:"Ball", pos:"line_2", color:"#F06595", desc:"B2 - 第二線", bg:"#FFF0F6", key:6, icon:"⚽", freq:123.47},
  {num:"16", clef:"bass", title:"Do (C3)", eng:"Car", pos:"space_2", color:"#FF6B6B", desc:"C3 - 第二間", bg:"#FFF0F0", key:0, icon:"🚗", freq:130.81},
  {num:"17", clef:"bass", title:"Re (D3)", eng:"Duck", pos:"line_3", color:"#FF922B", desc:"D3 - 第三線", bg:"#FFF4E6", key:1, icon:"🦆", freq:146.83},
  {num:"18", clef:"bass", title:"Mi (E3)", eng:"Egg", pos:"space_3", color:"#FCC419", desc:"E3 - 第三間", bg:"#FFF9DB", key:2, icon:"🥚", freq:164.81},
  {num:"19", clef:"bass", title:"Fa (F3)", eng:"Fox", pos:"line_4", color:"#51CF66", desc:"F3 - 第四線", bg:"#E6FCF5", key:3, icon:"🦊", freq:174.61},
  {num:"20", clef:"bass", title:"Sol (G3)", eng:"Goat", pos:"space_4", color:"#339AF0", desc:"G3 - 第四間", bg:"#E7F5FF", key:4, icon:"🐐", freq:196.00},
  {num:"21", clef:"bass", title:"La (A3)", eng:"Apple", pos:"line_5", color:"#845EF7", desc:"A3 - 第五線", bg:"#F3F0FF", key:5, icon:"🍎", freq:220.00},
  {num:"22", clef:"bass", title:"Ti (B3)", eng:"Balloon", pos:"space_above", color:"#F06595", desc:"B3 - 上加一間", bg:"#FFF0F6", key:6, icon:"🎈", freq:246.94},
  {num:"23", clef:"bass", title:"Do (C4)", eng:"Cat", pos:"line_above", color:"#FF6B6B", desc:"C4 - 中央 C (上加一線)", bg:"#FFF0F0", key:0, icon:"🐱", freq:261.63},
  {num:"24", clef:"bass", title:"Re (D4)", eng:"Dog", pos:"space_above_2", color:"#FF922B", desc:"D4 - 上加二間", bg:"#FFF4E6", key:1, icon:"🐶", freq:293.66},

  // 音樂符號 (8張)
  {num:"25", clef:"symbol", title:"Whole Note", eng:"全音符 (4拍)", svgKey:"whole", color:"#4DABF7", desc:"口訣：一—二—三—四", bg:"#E7F5FF", icon:"⏱️"},
  {num:"26", clef:"symbol", title:"Half Note", eng:"二分音符 (2拍)", svgKey:"half", color:"#51CF66", desc:"口訣：一—二—", bg:"#E6FCF5", icon:"✌️"},
  {num:"27", clef:"symbol", title:"Quarter Note", eng:"四分音符 (1拍)", svgKey:"quarter", color:"#FF922B", desc:"口訣：走", bg:"#FFF4E6", icon:"🚶"},
  {num:"28", clef:"symbol", title:"Eighth Note", eng:"八分音符 (0.5拍)", svgKey:"eighth", color:"#FCC419", desc:"口訣：跑", bg:"#FFF9DB", icon:"🏃"},
  {num:"29", clef:"symbol", title:"Pair Eighth", eng:"雙八分音符 (1拍)", svgKey:"pairEighth", color:"#845EF7", desc:"口訣：跑步", bg:"#F3F0FF", icon:"🏃‍♂️🏃‍♀️"},
  {num:"30", clef:"symbol", title:"Rest", eng:"四分休止符", svgKey:"rest", color:"#F06595", desc:"口訣：噓 (停一拍)", bg:"#FFF0F6", icon:"🤫"},
  {num:"31", clef:"symbol", title:"Treble Clef", eng:"高音譜號", svgKey:"trebleClef", color:"#339AF0", desc:"右手家族", bg:"#E7F5FF", icon:"✋"},
  {num:"32", clef:"symbol", title:"Bass Clef", eng:"低音譜號", svgKey:"bassClef", color:"#20C997", desc:"左手家族", bg:"#E6FCF5", icon:"🤚"}
];

let currentCards = [...cardsData];
let currentIndex = 0;
let isFlipped = false;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq) {
  if(!freq) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 1.2);
}

function renderStaffSVG(clef, pos) {
  const yMap = {
    "line_1": 80,
    "space_1": 72.5,
    "line_2": 65,
    "space_2": 57.5,
    "line_3": 50,
    "space_3": 42.5,
    "line_4": 35,
    "space_4": 27.5,
    "line_5": 20,
    "space_above": 12.5,
    "line_above": 5,
    "space_above_2": -2.5,
    "space_below": 87.5,
    "line_below": 95
  };

  const noteY = yMap[pos] || 50;
  const clefSymbol = clef === "treble" ? "𝄞" : "𝄢";
  const clefY = clef === "treble" ? 75 : 65;
  
  let extraLines = "";
  if (pos === "line_below") {
    extraLines = `<line x1="70" y1="95" x2="118" y2="95" stroke="#111" stroke-width="3"/>`;
  } else if (pos === "line_above" || pos === "space_above_2") {
    extraLines = `<line x1="70" y1="5" x2="118" y2="5" stroke="#111" stroke-width="3"/>`;
  }

  return `
    <svg width="200" height="130" viewBox="0 0 190 135">
      <line x1="10" y1="20" x2="180" y2="20" stroke="#222" stroke-width="2.5"/>
      <line x1="10" y1="35" x2="180" y2="35" stroke="#222" stroke-width="2.5"/>
      <line x1="10" y1="50" x2="180" y2="50" stroke="#222" stroke-width="2.5"/>
      <line x1="10" y1="65" x2="180" y2="65" stroke="#222" stroke-width="2.5"/>
      <line x1="10" y1="80" x2="180" y2="80" stroke="#222" stroke-width="2.5"/>
      <text x="15" y="${clefY}" font-size="52px" fill="#111">${clefSymbol}</text>
      ${extraLines}
      <ellipse cx="94" cy="${noteY}" rx="13" ry="9.5" fill="#111" transform="rotate(-15 94 ${noteY})"/>
    </svg>
  `;
}

function renderKeyboardSVG(activeKey, color) {
  const keysX = [5, 23, 41, 59, 77, 95, 113];
  const names = ["C", "D", "E", "F", "G", "A", "B"];
  let keysHTML = "";
  for(let i=0; i<7; i++) {
    const fill = (i === activeKey) ? color : "#ffffff";
    const textFill = (i === activeKey) ? "#ffffff" : "#333333";
    keysHTML += `<rect x="${keysX[i]}" y="5" width="16" height="38" fill="${fill}" stroke="#333" stroke-width="1.5" rx="2"/>
                 <text x="${keysX[i]+8}" y="36" font-size="9px" font-weight="bold" fill="${textFill}" text-anchor="middle">${names[i]}</text>`;
  }
  return `
    <svg width="150" height="45" viewBox="0 0 135 45">
      ${keysHTML}
      <rect x="17" y="5" width="9" height="22" fill="#222" rx="1"/>
      <rect x="35" y="5" width="9" height="22" fill="#222" rx="1"/>
      <rect x="71" y="5" width="9" height="22" fill="#222" rx="1"/>
      <rect x="89" y="5" width="9" height="22" fill="#222" rx="1"/>
      <rect x="107" y="5" width="9" height="22" fill="#222" rx="1"/>
    </svg>
  `;
}

function updateCard() {
  const card = currentCards[currentIndex];
  document.getElementById("card-num").innerText = `No. ${card.num}`;
  document.getElementById("card-num-back").innerText = `No. ${card.num} (答案)`;
  document.getElementById("card-title").innerText = card.title;
  document.getElementById("card-title").style.color = card.color;
  document.getElementById("card-icon").innerText = card.icon;
  document.getElementById("card-eng").innerText = `聯想單字：${card.eng}`;
  document.getElementById("card-desc").innerText = card.desc;
  
  const backFace = document.getElementById("card-back-face");
  backFace.style.backgroundColor = card.bg;
  backFace.style.borderColor = card.color;

  if(card.clef === "symbol") {
    document.getElementById("staff-svg").innerHTML = symbolSVGs[card.svgKey];
    document.getElementById("keyboard-svg").innerHTML = "";
  } else {
    document.getElementById("staff-svg").innerHTML = renderStaffSVG(card.clef, card.pos);
    document.getElementById("keyboard-svg").innerHTML = renderKeyboardSVG(card.key, card.color);
  }

  if(isFlipped) {
    document.getElementById("main-card").classList.remove("flipped");
    isFlipped = false;
  }
}

function flipCard() {
  const card = document.getElementById("main-card");
  card.classList.toggle("flipped");
  isFlipped = !isFlipped;
  
  if(isFlipped && currentCards[currentIndex].freq) {
    playSound(currentCards[currentIndex].freq);
  }
}

function nextCard(e) {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentCards.length;
  updateCard();
}

function prevCard(e) {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
  updateCard();
}

function filterCategory() {
  const cat = document.getElementById("category-select").value;
  if(cat === "all") currentCards = [...cardsData];
  else currentCards = cardsData.filter(c => c.clef === cat);
  currentIndex = 0;
  updateCard();
}

function shuffleCards() {
  currentCards.sort(() => Math.random() - 0.5);
  currentIndex = 0;
  updateCard();
}

updateCard();
</script>
</body>
</html>
